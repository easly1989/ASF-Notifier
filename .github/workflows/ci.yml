name: Plugin-ci

on: [pull_request, push, workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET Core
      run: dotnet --info

    - name: Build Release
      run: dotnet build -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

    - name: Test Release
      run: dotnet test ASFNotifier.Tests -c Release --no-build --nologo

  # ASF's OS-specific builds are trimmed: a type or member ASF itself never uses is gone at run time (issue #23)
  trimmed-asf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Publish plugin
      run: dotnet publish ASFNotifier -c Release -o out/plugin -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo

    - name: Download the official ASF releases
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        # The ASF release the plugin builds against, as Plugin-bump-asf-reference keeps it
        asf_version="$(git config -f .gitmodules submodule.ArchiSteamFarm.branch)"
        echo "ASF ${asf_version}"

        mkdir -p asf
        cd asf
        gh release download "$asf_version" -R JustArchiNET/ArchiSteamFarm -p 'ASF-linux-*.zip' -p 'ASF-osx-*.zip' -p 'ASF-win-*.zip' -p SHA512SUMS
        sha512sum -c --ignore-missing SHA512SUMS

        for zip in ASF-*.zip; do
            variant="${zip#ASF-}"
            unzip -q "$zip" -d "${variant%.zip}"
        done

    - name: Check the plugin's references against every trimmed build
      shell: bash
      run: |
        set -euo pipefail

        dotnet build tools/TrimCheck -c Release --nologo

        for dir in asf/*/; do
            echo "== ${dir}"
            dotnet tools/TrimCheck/bin/Release/net10.0/TrimCheck.dll "$dir" out/plugin/ASFNotifier.dll
        done

    - name: Smoke test in the trimmed linux-x64 build
      run: bash tools/smoke/smoke.sh asf/linux-x64 out/plugin
