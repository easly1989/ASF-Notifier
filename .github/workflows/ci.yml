name: Plugin-ci

on: [pull_request, push, workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET Core
      run: dotnet --info

    - name: Build Release
      run: dotnet build -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

    - name: Test Release
      run: dotnet test ASFNotifier.Tests -c Release --no-build --nologo

  # ASF's OS-specific builds are trimmed: a type or member ASF itself never uses is gone at run time (issue #23)
  trimmed-asf:
    uses: ./.github/workflows/trimmed-asf.yml
